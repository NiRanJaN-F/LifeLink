services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: lifelink-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: lifelink_db
      MYSQL_USER: lifelink_user
      MYSQL_PASSWORD: lifelink_password
    ports:
      - "3306:3306"
    volumes:
      - lifelink_mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # LifeLink Express Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lifelink-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: lifelink_user
      DB_PASSWORD: lifelink_password
      DB_NAME: lifelink_db
      JWT_SECRET: dev_jwt_secret_for_local_testing_only_32_characters_minimum
      CLIENT_URL: http://localhost,http://localhost:5173,http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy

  # LifeLink React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: lifelink-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  lifelink_mysql_data:
